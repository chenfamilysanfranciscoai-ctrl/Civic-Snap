<style>
*{ box-sizing: border-box; }
html, body{
  margin: 0;
  height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
}
/* Site header + nav is a flex column with the map filling whatever space
   is left -- this is more robust than a hardcoded "100vh minus N pixels"
   height, since the header can wrap to two lines on narrow screens now
   that it also holds the tab navigation. */
body{
  display: flex;
  flex-direction: column;
}

#map-wrap{
  position: relative;
  width: 100%;
  flex: 1;
  min-height: 0;
}
#map{
  width: 100%;
  height: 100%;
  background: var(--moss-light);
}

/* ---- map pins ----
   The basemap (tiles, pan, zoom, rotation) is rendered by MapLibre GL JS
   -- a modern, open-source vector-tile renderer, which is why panning and
   zooming feel smooth and the map itself looks sharp at any zoom level
   instead of soft/pixelated raster tiles. Each pin below is a plain HTML
   element handed to MapLibre's own Marker class, so MapLibre keeps it
   positioned correctly through every pan/zoom/rotate automatically --
   there's no manual position-recalculation code needed at all.

   IMPORTANT: MapLibre positions a marker by writing its own inline
   `transform` (translate) directly onto the element you hand it, which
   silently overrides any CSS `transform` rule targeting that same
   element (inline styles always win over stylesheet rules). So the
   outer ".pin-anchor" element -- the one actually passed to
   `new maplibregl.Marker({ element: ... })` -- must never have a
   `transform` of its own. All of the pin's own visual styling
   (including the hover scale-up) lives on the nested ".pin" child
   instead, where it can't collide with MapLibre's positioning. */
.pin-anchor{
  width: 30px;
  height: 30px;
  cursor: pointer;
}
.pin{
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2.5px solid white;
  box-shadow: 0 3px 6px rgba(0,0,0,0.28);
  transition: box-shadow 0.15s ease, transform 0.15s ease;
}
.pin svg{
  pointer-events: none;
}
.pin.is-hovered{
  box-shadow: 0 6px 14px rgba(0,0,0,0.38);
  transform: scale(1.15);
}

/* Several events can share one address (a food bank warehouse, a dining
   room). They get ONE pin with a count badge instead of stacking on top of
   each other where only the top one could ever be clicked. */
.pin.is-group{
  position: relative;
  font-size: 0.78rem;
  font-weight: 800;
  color: #fff;
  font-family: 'Inter', system-ui, sans-serif;
}
.pin.is-wide{ font-size: 0.64rem; letter-spacing: -0.02em; }
.pin-badge{
  pointer-events: none;
  line-height: 1;
}

/* Popup for a pin with more than one event: a short header and a
   scrollable list, one compact card per event. */
.popup-group-head{
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--clay-dark);
  margin: 0 18px 4px 0;
}
.popup-group-where{
  font-size: 0.82rem;
  color: #4b463c;
  margin: 0 0 8px 0;
}
.popup-list{
  max-height: 260px;
  overflow-y: auto;
  margin: 0 -6px 0 0;
  padding-right: 6px;
}
.popup-item{
  border-top: 1px solid #e6e0d0;
  padding: 8px 0 10px;
}
.popup-item .popup-org{ margin: 0 0 2px 0; }
.popup-item .popup-title{ font-size: 0.92rem; margin: 0 0 4px 0; }
.popup-item .popup-row{ margin: 2px 0; }
.popup-item .help-btn{ margin-top: 8px; padding: 7px 12px; font-size: 0.8rem; }

/* MapLibre's own popup, reskinned to match this site's card style instead
   of the library default (removing its default background/tip so ours,
   below, take over). */
.maplibregl-popup{
  max-width: 260px !important;
}
.maplibregl-popup-content{
  background: var(--paper);
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(20,30,20,0.22);
  padding: 14px 16px;
  width: 240px;
  font-family: 'Inter', system-ui, sans-serif;
}
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip{
  border-top-color: var(--paper);
}
.maplibregl-popup-anchor-top .maplibregl-popup-tip{
  border-bottom-color: var(--paper);
}
.maplibregl-popup-close-button{
  color: #8a8577;
  font-size: 18px;
  padding: 4px 8px;
}
.popup-org{
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--clay-dark);
  margin: 0 18px 5px 0;
}
.popup-title{
  font-size: 1.02rem;
  font-weight: 700;
  color: var(--moss-dark);
  margin: 0 0 10px 0;
  line-height: 1.25;
}
.popup-row{
  font-size: 0.82rem;
  color: #4b463c;
  margin: 4px 0;
  display: flex;
  gap: 8px;
}
.popup-row b{
  color: var(--moss-dark);
  min-width: 40px;
  font-weight: 600;
}
.help-btn{
  display: block;
  text-align: center;
  margin-top: 12px;
  background: var(--clay);
  color: white;
  border: none;
  padding: 9px 14px;
  border-radius: 9px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.15s ease, transform 0.1s ease;
}
.help-btn:hover{
  background: var(--clay-dark);
  transform: translateY(-1px);
}
.help-btn.disabled{
  background: #cfc9ba;
  color: #6b6656;
  cursor: not-allowed;
}
.help-btn.disabled:hover{
  background: #cfc9ba;
  transform: none;
}

.legend{
  position: absolute;
  bottom: 22px;
  left: 16px;
  z-index: 5;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(6px);
  padding: 12px 16px;
  border-radius: 12px;
  box-shadow: 0 6px 20px rgba(20,30,20,0.15);
  font-size: 0.8rem;
  border: 1px solid var(--line);
}
.legend-title{
  font-weight: 700;
  color: var(--moss-dark);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.legend div.row{
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 0;
  color: #4b463c;
}
.dot{
  width: 11px;
  height: 11px;
  border-radius: 50%;
  display: inline-block;
  box-shadow: 0 0 0 2px white, 0 1px 4px rgba(0,0,0,0.25);
}

.stat-box{
  position: absolute;
  top: 18px;
  right: 16px;
  z-index: 5;
  background: var(--moss-dark);
  color: var(--paper);
  padding: 12px 18px;
  border-radius: 12px;
  box-shadow: 0 8px 22px rgba(20,30,20,0.3);
  font-size: 0.8rem;
  text-align: center;
  min-width: 160px;
}
.stat-box .label{
  opacity: 0.75;
  font-size: 0.72rem;
}
.stat-box .big{
  font-size: 1.7rem;
  font-weight: 800;
  color: #ffffff;
  line-height: 1.2;
}

/* ---- date filter bar (top-left of the map) ---- */
.map-top{
  position: absolute;
  top: 18px;
  left: 16px;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  max-width: calc(100% - 210px);
  pointer-events: none;           /* only the boxes inside catch clicks */
}
.map-top > *{ pointer-events: auto; }
.filter-bar{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  max-width: 100%;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(6px);
  padding: 5px;
  border-radius: 12px;
  border: 1px solid var(--line);
  box-shadow: 0 6px 20px rgba(20,30,20,0.15);
}
.filter-btn{
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  color: #6b6656;
  background: transparent;
  border: none;
  padding: 7px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.filter-btn:hover{
  background: var(--moss-light);
  color: var(--moss-dark);
}
.filter-btn.active{
  background: var(--moss);
  color: white;
}
.filter-btn:focus-visible{
  outline: 2px solid var(--clay);
  outline-offset: 1px;
}
.filter-count{
  font-size: 0.72rem;
  color: #8a8577;
  padding: 0 8px 0 6px;
  white-space: nowrap;
}
.filter-empty{
  max-width: 100%;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 6px 20px rgba(20,30,20,0.15);
  padding: 10px 14px;
  font-size: 0.82rem;
  color: #4b463c;
}
.filter-empty[hidden]{ display: none; }


/* ---- search box + "near me" (under the date filter) ---- */
.finder{
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  max-width: 430px;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(6px);
  padding: 5px;
  border-radius: 12px;
  border: 1px solid var(--line);
  box-shadow: 0 6px 20px rgba(20,30,20,0.15);
}
.finder-search{
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
}
.finder-search svg{
  position: absolute;
  left: 9px;
  top: 50%;
  width: 15px;
  height: 15px;
  transform: translateY(-50%);
  color: #8a8577;
  pointer-events: none;
}
.finder-input{
  width: 100%;
  font-family: inherit;
  font-size: 0.85rem;
  color: #1f2b23;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 30px 8px 30px;
}
.finder-input:focus{
  outline: 2px solid var(--clay);
  outline-offset: 0;
}
.finder-clear{
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  color: #8a8577;
  font-size: 1.1rem;
  line-height: 1;
  padding: 4px 7px;
  border-radius: 6px;
  cursor: pointer;
}
.finder-clear:hover{ background: var(--moss-light); color: var(--moss-dark); }
.finder-clear[hidden]{ display: none; }
.near-btn{
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 700;
  color: #fff;
  background: var(--clay);
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s ease;
}
.near-btn:hover{ background: var(--clay-dark); }
.near-btn:disabled{ background: #cfc9ba; color: #6b6656; cursor: wait; }
.near-btn:focus-visible{ outline: 2px solid var(--moss-dark); outline-offset: 2px; }
.near-btn svg{ width: 15px; height: 15px; }

.near-status{
  max-width: 100%;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 6px 20px rgba(20,30,20,0.15);
  padding: 9px 13px;
  font-size: 0.8rem;
  color: #4b463c;
}
.near-status[hidden]{ display: none; }
.near-status.is-error{ border-color: #d9a48f; }

/* "Closest to you" list */
.nearby{
  width: 330px;
  max-width: 100%;
  max-height: min(46vh, 420px);
  display: flex;
  flex-direction: column;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(20,30,20,0.22);
  overflow: hidden;
}
.nearby[hidden]{ display: none; }
.nearby-head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px 8px 14px;
  border-bottom: 1px solid var(--line);
}
.nearby-title{
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--moss-dark);
}
.nearby-close{
  font-family: inherit;
  font-size: 0.72rem;
  font-weight: 600;
  color: #6b6656;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 4px 8px;
  cursor: pointer;
}
.nearby-close:hover{ background: var(--moss-light); color: var(--moss-dark); }
.nearby-list{
  list-style: none;
  margin: 0;
  padding: 0;
  overflow-y: auto;
}
.nearby-item{ border-bottom: 1px solid #eee9db; }
.nearby-item:last-child{ border-bottom: none; }
.nearby-go{
  display: block;
  width: 100%;
  text-align: left;
  font-family: inherit;
  background: transparent;
  border: none;
  padding: 10px 14px;
  cursor: pointer;
  color: #4b463c;
}
.nearby-go:hover, .nearby-go:focus-visible{ background: var(--moss-light); outline: none; }
.nearby-dist{
  font-size: 0.7rem;
  font-weight: 800;
  color: var(--clay-dark);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.nearby-name{
  display: block;
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--moss-dark);
  margin: 2px 0;
  line-height: 1.25;
}
.nearby-sub{ display: block; font-size: 0.76rem; line-height: 1.35; }
.nearby-note{
  font-size: 0.7rem;
  color: #8a8577;
  padding: 8px 14px 10px;
  border-top: 1px solid var(--line);
}

/* the blue dot that marks where you are */
.user-dot{
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #2b6cdf;
  border: 3px solid #fff;
  box-shadow: 0 0 0 0 rgba(43,108,223,0.5), 0 2px 6px rgba(0,0,0,0.35);
  animation: userPulse 2s ease-out infinite;
}
@keyframes userPulse{
  0%{ box-shadow: 0 0 0 0 rgba(43,108,223,0.5), 0 2px 6px rgba(0,0,0,0.35); }
  80%,100%{ box-shadow: 0 0 0 16px rgba(43,108,223,0), 0 2px 6px rgba(0,0,0,0.35); }
}
@media (prefers-reduced-motion: reduce){ .user-dot{ animation: none; } }
.popup-dist{
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--clay-dark);
  margin: 0 0 6px 0;
}

.maplibregl-ctrl-top-right{
  top: 90px !important;
}

/* Narrow screens: the filter bar takes the full width along the top, and the
   "I will help" counter and zoom buttons shift down underneath it (the legend
   keeps the bottom-left corner to itself). */
@media (max-width: 640px){
  .map-top{
    right: 16px;
    max-width: none;
  }
  .finder{ max-width: none; }
  .nearby{ width: 100%; max-height: 38vh; }
  /* the counter and zoom buttons move to the bottom-right so the search box
     and the "closest to you" list can use the full width up top */
  .stat-box{
    top: auto;
    bottom: 22px;
    min-width: 0;
    max-width: 130px;
    padding: 8px 12px;
  }
  .stat-box .big{ font-size: 1.3rem; }
  .maplibregl-ctrl-top-right{
    top: auto !important;
    bottom: 100px;
  }
  .near-btn .near-label-long{ display: none; }
}
@media (max-width: 360px){
  .filter-bar{ gap: 2px; }
  .filter-btn{
    padding: 7px 6px;
    font-size: 0.72rem;
  }
}
.maplibregl-ctrl-group{
  border-radius: 8px !important;
  box-shadow: 0 6px 18px rgba(20,30,20,0.18) !important;
  overflow: hidden;
}
</style>

<script>
// Defensive clean-up of events.json before anything is shown. Drops events that
// have no real location (placeholder text like "<UNKNOWN>", or coordinates that
// are not in the Bay Area, which is what a failed address lookup can produce)
// and blanks start/end values that are not clock times.
function cleanEventData(data){
  var timeRe = /^\d{1,2}(:\d{2})?\s*[AP]M$/i;
  var noLoc = /^\s*(tbd|tba|n\/a|none)?\s*$|<\s*unknown\s*>|to be (determined|announced)/i;
  return (Array.isArray(data) ? data : []).map(function(g){
    var list = ((g && g.events) || []).filter(function(e){
      if (!e) return false;
      if (noLoc.test(String(e.location == null ? '' : e.location))) return false;
      var lat = +e.lat, lng = +e.lng;
      return isFinite(lat) && isFinite(lng) && lat > 36.8 && lat < 38.7 && lng > -123.4 && lng < -121.0;
    }).map(function(e){
      var s = String(e.start == null ? '' : e.start).trim(), t = String(e.end == null ? '' : e.end).trim();
      return Object.assign({}, e, { start: timeRe.test(s) ? s : '', end: timeRe.test(t) ? t : '' });
    });
    return Object.assign({}, g, { events: list });
  });
}
</script>
<script>
// ---- mock-data toggle ----
// Set to true to skip the events.json fetch and use the placeholder data
// below instead -- useful if we're ever iterating on looks again without
// wanting to depend on real data. Live site should stay on false.
const USE_MOCK_DATA = false;

const MOCK_DATA = [

      { name: "Sample Invasive Removal", date: "2026-11-22", day: "Sunday", start: "9:00 AM", end: "11:30 AM", location: "Foothills Park, Palo Alto", lat: 37.3640, lng: -122.1610, bookingUrl: "#" }
    ]
  },
  {

    color: "#d9642b",
    orgUrl: "#",
    events: [
      { name: "Sample Bay Shoreline Cleanup", date: "2026-11-01", day: "Sunday", start: "10:00 AM", location: "Heron's Head Park, San Francisco", lat: 37.7407, lng: -122.3773, bookingUrl: "#" },
      { name: "Sample Water Quality Monitoring", date: "2026-11-08", day: "Sunday", start: "8:30 AM", end: "10:30 AM", location: "Candlestick Point, San Francisco", lat: 37.7180, lng: -122.3700, bookingUrl: "#" }
    ]
  }
];

// ---- event data normally lives in events.json, loaded at runtime ----
// This is the file Cowork should overwrite each month -- nothing in this
// <script> block needs to change for a routine data update.
let orgData = [];

async function loadOrgData(){
  if (USE_MOCK_DATA) {
    orgData = MOCK_DATA;
    return;
  }
  try {
    // Bust both the browser cache and GitHub Pages' CDN cache with a
    // per-load timestamp, and also tell fetch() itself not to use any
    // cached copy -- without this, a visitor (or the site owner testing it
    // right after a data update) can keep seeing an old events.json long
    // after a newer one has been pushed, which looks exactly like "wrong
    // dates" or "the wrong event" even though the source data is correct.
    const res = await fetch('events.json?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('events.json request failed: ' + res.status);
    orgData = cleanEventData(await res.json());
  } catch (err) {
    console.error('Could not load events.json', err);
    document.getElementById('map-wrap').insertAdjacentHTML(
      'beforeend',
      '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);' +
      'background:#fbfaf7;border:1px solid #e4e0d6;padding:14px 20px;border-radius:10px;' +
      'font-family:Inter,system-ui,sans-serif;font-size:0.85rem;color:#1f2b23;z-index:1000;">' +
      'Couldn\'t load event data (events.json). If you opened this file directly, serve it ' +
      'over a local web server instead of file:// so the fetch works.</div>'
    );
  }
}

// ---- map setup ----
// MapLibre GL JS (an open-source, actively-maintained vector-tile renderer
// -- the same underlying technology as Mapbox/Google Maps' smooth "app-
// like" pan and zoom) replaces the earlier Leaflet+D3 combination.
// Rendering vector tiles instead of flat raster images is what makes the
// zoom/pan feel noticeably smoother and the map look sharp at any zoom
// level, on any screen. "liberty" is a free, no-API-key-required basemap
// style from OpenFreeMap with a fuller, more standard map color palette
// (green parks, blue water, warm road tones) -- swapped in for the
// earlier near-grayscale "positron" style per the "add some color"
// feedback. Other OpenFreeMap styles ("positron", "bright") are one-word
// swaps here if we want to try a different look later.
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [-122.47, 37.63], // MapLibre takes [lng, lat] -- the opposite order from Leaflet
  zoom: 10,
  attributionControl: { compact: true }
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

function formatDate(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// Minimal HTML-attribute escaping for values we interpolate into href/title
// attributes -- everything here comes from our own events.json (itself
// produced from verify_url()-checked links), but this costs nothing and
// means a stray quote or angle bracket in a title/URL can never break the
// markup or open an injection path.
function escapeAttr(str){
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// ---- shared, persistent booking counter ----
async function loadBookingCount(){
  try{
    const result = await window.storage.get('total_bookings', true);
    const value = result ? parseInt(result.value, 10) : 0;
    animateCountTo(document.getElementById('bookingCount'), value);
  } catch(e){
    document.getElementById('bookingCount').textContent = "0";
  }
}

// Small "count up" animation for the stat box, instead of the number just
// appearing -- purely cosmetic, never affects the real stored count.
function animateCountTo(el, target){
  if (!target){ el.textContent = "0"; return; }
  const duration = 600;
  const start = performance.now();
  function tick(now){
    const t = Math.min(1, (now - start) / duration);
    el.textContent = Math.round(t * target);
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

async function recordBooking(eventName){
  try{
    let current = 0;
    try{
      const existing = await window.storage.get('total_bookings', true);
      current = existing ? parseInt(existing.value, 10) : 0;
    } catch(e){ current = 0; }
    const updated = current + 1;
    await window.storage.set('total_bookings', String(updated), true);
    document.getElementById('bookingCount').textContent = updated;

    const key = 'event_clicks:' + eventName.replace(/\s+/g, '_').toLowerCase();
    let eventCount = 0;
    try{
      const existingEvent = await window.storage.get(key, true);
      eventCount = existingEvent ? parseInt(existingEvent.value, 10) : 0;
    } catch(e){ eventCount = 0; }
    await window.storage.set(key, String(eventCount + 1), true);
  } catch(e){
    console.error('Booking storage error:', e);
  }
}

function popupContentHtml(d, opts){
  const compact = !!(opts && opts.compact);
  const timeStr = d.start ? (d.end ? `${d.start} - ${d.end}` : d.start) : 'Time to be announced';

  // The whole point of this map is that each pin sends a volunteer to a
  // REAL sign-up page. Prefer this event's own bookingUrl; if this org
  // only has a general page (no event-specific link was found), fall
  // back to its orgUrl. Only if neither exists do we show a disabled
  // button rather than a dead "#" link that silently goes nowhere.
  // The click is recorded by one delegated handler (see below) from the
  // data-event-name attribute, so no event text is ever pasted into
  // inline JavaScript.
  const signupUrl = d.bookingUrl || d.orgUrl || null;
  const helpButtonHtml = signupUrl
    ? `<a class="help-btn" href="${escapeAttr(signupUrl)}" target="_blank" rel="noopener noreferrer" data-event-name="${escapeAttr(d.name)}">I will help! →</a>`
    : `<span class="help-btn disabled" title="No sign-up link found yet for this event -- check the organization's site directly">Sign-up link coming soon</span>`;

  return `
    <p class="popup-org">${escapeAttr(d.org)}</p>
    <p class="popup-title">${escapeAttr(d.name)}</p>
    <div class="popup-row"><b>Date</b> ${escapeAttr(d.day)}, ${formatDate(d.date)}</div>
    <div class="popup-row"><b>Time</b> ${escapeAttr(timeStr)}</div>
    ${compact ? '' : `<div class="popup-row"><b>Where</b> ${escapeAttr(d.location)}</div>`}
    ${helpButtonHtml}
  `;
}

// Popup body for a pin: one event shows the usual card; several events at
// the same spot show a scrollable list (soonest first).
function distLabel(mi){
  if (mi == null) return '';
  return mi < 0.1 ? 'Less than 0.1 mi from you' : `${mi < 10 ? mi.toFixed(1) : Math.round(mi)} mi from you`;
}

function groupPopupHtml(events, distMi){
  const distHtml = distMi == null ? '' : `<p class="popup-dist">${distLabel(distMi)}</p>`;
  if (events.length === 1) return distHtml + popupContentHtml(events[0]);
  const sorted = events.slice().sort((x, y) =>
    (x.date + (x.start || '')).localeCompare(y.date + (y.start || '')));
  const items = sorted.map(ev =>
    `<div class="popup-item">${popupContentHtml(ev, { compact: true })}</div>`).join('');
  return `
    <p class="popup-group-head">${sorted.length} events here</p>
    ${distHtml}
    <p class="popup-group-where">${escapeAttr(sorted[0].location)}</p>
    <div class="popup-list">${items}</div>
  `;
}

// One delegated listener for every "I will help!" button on the page
// (popups are created and replaced dynamically).
document.addEventListener('click', e => {
  const btn = e.target.closest && e.target.closest('a.help-btn[data-event-name]');
  if (btn) recordBooking(btn.getAttribute('data-event-name'));
});

// ---- one MapLibre Marker per LOCATION ----
// Unlike the earlier D3 version, there's no manual pixel-position math or
// zoom/pan event listeners here: MapLibre's own Marker class tracks the
// map's projection internally and repositions its element automatically,
// so this is genuinely simpler as well as smoother.
//
// Events at the same coordinates are grouped into a single pin. Without
// this, 144 events at one address drew 144 pins in the same pixel and the
// map looked nearly empty.
const GROUP_COLOR = '#3d4a3a';

function groupEventsByPlace(){
  const groups = new Map();
  orgData.forEach(orgGroup => {
    orgGroup.events.forEach(ev => {
      const key = Number(ev.lat).toFixed(4) + ',' + Number(ev.lng).toFixed(4);
      if (!groups.has(key)) groups.set(key, { lat: ev.lat, lng: ev.lng, events: [] });
      groups.get(key).events.push(Object.assign({}, ev, {
        org: orgGroup.org, orgUrl: orgGroup.orgUrl, color: orgGroup.color
      }));
    });
  });
  return Array.from(groups.values());
}

function renderPins(){
  // Start from a clean slate so this can never double-draw pins.
  pinRecords.forEach(r => r.marker.remove());
  pinRecords = [];

  groupEventsByPlace().forEach(g => {
    // anchorEl is what gets handed to maplibregl.Marker -- it must stay
    // free of any CSS transform of ours (see the big comment on
    // .pin-anchor above). The colored circle + hover scale-up live on
    // the nested .pin child instead.
    const anchorEl = document.createElement('div');
    anchorEl.className = 'pin-anchor';
    const pinEl = document.createElement('div');
    pinEl.className = 'pin';
    anchorEl.appendChild(pinEl);
    anchorEl.addEventListener('mouseenter', () => pinEl.classList.add('is-hovered'));
    anchorEl.addEventListener('mouseleave', () => pinEl.classList.remove('is-hovered'));

    const popup = new maplibregl.Popup({ offset: 20, closeButton: true, maxWidth: '280px' });
    const marker = new maplibregl.Marker({ element: anchorEl, anchor: 'center' })
      .setLngLat([g.lng, g.lat])
      .setPopup(popup)
      .addTo(map);

    // The pin's look and popup depend on which of its events pass the
    // current date filter, so they are (re)drawn by applyFilter below.
    pinRecords.push({ marker, popup, pinEl, events: g.events, lat: g.lat, lng: g.lng, visibleEvents: [] });
  });

  applyFilter(currentFilter);
}

function paintPin(rec, visibleEvents){
  const pinEl = rec.pinEl;
  const n = visibleEvents.length;
  const orgs = new Set(visibleEvents.map(e => e.org));
  if (n > 1){
    pinEl.classList.add('is-group');
    pinEl.classList.toggle('is-wide', n > 99);
    pinEl.style.background = orgs.size === 1 ? visibleEvents[0].color : GROUP_COLOR;
    pinEl.innerHTML = `<span class="pin-badge">${n > 999 ? '999+' : n}</span>`;
  } else {
    pinEl.classList.remove('is-group');
    pinEl.style.background = visibleEvents[0].color;
    pinEl.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-14 14z"/><path d="M5 19l8-8"/></svg>';
  }
  rec.popup.setHTML(groupPopupHtml(visibleEvents, userPos ? milesBetween(userPos, rec) : null));
}

// ---- date filter ----
// Buttons above the map narrow the pins to a date window. Weeks run
// Monday-Sunday ("This Week" = today through this coming Sunday, "Next Week"
// = the following Monday-Sunday). "Next 30 Days" = today through 30 days out.
// Event dates are plain YYYY-MM-DD strings, so the windows below are too and
// can be compared as strings -- no timezone math involved.
let pinRecords = [];
let currentFilter = 'all';

function toISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function filterRange(key, now){
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const plusDays = n => new Date(today.getFullYear(), today.getMonth(), today.getDate() + n);
  const daysSinceMonday = (today.getDay() + 6) % 7; // Mon=0 ... Sun=6
  const endOfThisWeek = 6 - daysSinceMonday;        // days from today to this Sunday

  if (key === 'week')     return { start: toISODate(today), end: toISODate(plusDays(endOfThisWeek)) };
  if (key === 'nextweek') return { start: toISODate(plusDays(endOfThisWeek + 1)), end: toISODate(plusDays(endOfThisWeek + 7)) };
  if (key === 'month')    return { start: toISODate(today), end: toISODate(plusDays(30)) };
  return null; // 'all' -- no limits
}

function applyFilter(key){
  currentFilter = key;
  const range = filterRange(key, new Date());

  document.querySelectorAll('.filter-btn').forEach(btn => {
    const on = btn.dataset.filter === key;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  });

  let shown = 0;
  let total = 0;
  pinRecords.forEach(r => {
    const visibleEvents = r.events.filter(ev =>
      (!range || (ev.date >= range.start && ev.date <= range.end)) && matchesSearch(ev));
    r.visibleEvents = visibleEvents;
    total += r.events.length;
    shown += visibleEvents.length;
    if (visibleEvents.length){
      paintPin(r, visibleEvents);
      r.marker.getElement().style.display = '';
    } else {
      r.marker.getElement().style.display = 'none';
      if (r.popup.isOpen()) r.popup.remove();
    }
  });

  const countEl = document.getElementById('filterCount');
  if (total === 0) {
    countEl.textContent = '';
  } else if (shown === total) {
    countEl.textContent = `${total} event${total === 1 ? '' : 's'}`;
  } else {
    countEl.textContent = `${shown} of ${total} events`;
  }
  document.getElementById('filterEmpty').hidden = !(total > 0 && shown === 0);
  renderNearby();
}


// ---- search box ----
// Narrows the pins to events whose name, organization, address or tags contain
// every word typed (so "food san jose" works). It combines with the date
// filter above. Enter zooms the map to what is left.
let searchTerms = [];

function eventHaystack(ev){
  return [ev.name, ev.org, ev.location, (ev.tags || []).join(' ')].join(' ').toLowerCase();
}
function matchesSearch(ev){
  if (!searchTerms.length) return true;
  const hay = ev._hay || (ev._hay = eventHaystack(ev));
  return searchTerms.every(t => hay.includes(t));
}

const searchInput = document.getElementById('mapSearch');
const searchClear = document.getElementById('mapSearchClear');
let searchTimer = null;

function setSearch(text){
  searchTerms = text.toLowerCase().split(/\s+/).filter(Boolean);
  searchClear.hidden = !text;
  applyFilter(currentFilter);
}
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => setSearch(searchInput.value), 200);
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  setSearch('');
  searchInput.focus();
});

function fitToVisible(extraPoints){
  const pts = pinRecords.filter(r => r.visibleEvents.length).map(r => [r.lng, r.lat]).concat(extraPoints || []);
  if (!pts.length) return;
  const b = new maplibregl.LngLatBounds(pts[0], pts[0]);
  pts.forEach(pt => b.extend(pt));
  map.fitBounds(b, { padding: { top: 120, bottom: 60, left: 60, right: 60 }, maxZoom: 14, duration: 700 });
}

// ---- "Near me" ----
let userPos = null;        // { lat, lng } -- lives only in this page, never sent anywhere
let userMarker = null;
const nearBtn = document.getElementById('nearBtn');
const nearStatus = document.getElementById('nearStatus');
const nearby = document.getElementById('nearby');
const nearbyList = document.getElementById('nearbyList');

function milesBetween(a, b){
  const R = 3958.8, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 +
            Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

function showNearStatus(text, isError){
  nearStatus.textContent = text;
  nearStatus.classList.toggle('is-error', !!isError);
  nearStatus.hidden = !text;
}

// The closest pins that still pass the date and search filters, nearest first.
function nearestRecords(limit){
  if (!userPos) return [];
  return pinRecords
    .filter(r => r.visibleEvents.length)
    .map(r => ({ rec: r, mi: milesBetween(userPos, r) }))
    .sort((x, y) => x.mi - y.mi)
    .slice(0, limit);
}

function shortWhere(loc){
  // "Cypress Center, 4001 N 1st St., San Jose, CA 95134" -> first two parts
  return String(loc).split(',').slice(0, 2).join(',').trim();
}

function renderNearby(){
  if (!userPos){ nearby.hidden = true; return; }
  const list = nearestRecords(5);
  if (!list.length){
    nearby.hidden = true;
    showNearStatus('No events match the current filters, so there is nothing to show near you. Try "All" or clear the search.', true);
    return;
  }
  const far = list[0].mi > 60;
  showNearStatus(far ? `The closest event is about ${Math.round(list[0].mi)} miles away. Civic Snap covers the San Francisco Bay Area.` : '', false);
  nearbyList.innerHTML = list.map((item, i) => {
    const evs = item.rec.visibleEvents.slice().sort((x, y) =>
      (x.date + (x.start || '')).localeCompare(y.date + (y.start || '')));
    const first = evs[0];
    const when = `${first.day.slice(0, 3)}, ${formatDate(first.date).replace(/, \d{4}$/, '')}${first.start ? ' at ' + first.start : ''}`;
    const many = evs.length > 1 ? `${evs.length} events here &middot; next: ` : '';
    return `<li class="nearby-item"><button type="button" class="nearby-go" data-idx="${i}">
      <span class="nearby-dist">${distLabel(item.mi).replace(' from you', '')} away</span>
      <span class="nearby-name">${escapeAttr(shortWhere(first.location))}</span>
      <span class="nearby-sub">${many}${escapeAttr(first.name)} &middot; ${escapeAttr(when)}</span>
      <span class="nearby-sub">${escapeAttr(first.org)}</span></button></li>`;
  }).join('');
  nearbyList._records = list.map(x => x.rec);
  nearby.hidden = false;
}

nearbyList.addEventListener('click', e => {
  const btn = e.target.closest('.nearby-go');
  if (!btn) return;
  const rec = nearbyList._records && nearbyList._records[Number(btn.dataset.idx)];
  if (!rec) return;
  map.flyTo({ center: [rec.lng, rec.lat], zoom: Math.max(map.getZoom(), 14), duration: 800 });
  pinRecords.forEach(r => { if (r !== rec && r.popup.isOpen()) r.popup.remove(); });
  if (!rec.popup.isOpen()) rec.marker.togglePopup();
});

function clearLocation(){
  userPos = null;
  if (userMarker){ userMarker.remove(); userMarker = null; }
  nearby.hidden = true;
  showNearStatus('', false);
  applyFilter(currentFilter);   // repaint popups without the "mi from you" line
}
document.getElementById('nearbyClose').addEventListener('click', clearLocation);

function placeUserMarker(){
  if (userMarker) userMarker.remove();
  const el = document.createElement('div');
  el.className = 'user-dot';
  el.setAttribute('role', 'img');
  el.setAttribute('aria-label', 'Your location');
  userMarker = new maplibregl.Marker({ element: el, anchor: 'center' })
    .setLngLat([userPos.lng, userPos.lat]).addTo(map);
}

function geoErrorMessage(err){
  if (err && err.code === 1) return 'Location is blocked for this site. Allow it in your browser\'s address bar and try again, or use the search box (try a city name).';
  if (err && err.code === 3) return 'Finding your location took too long. Please try again, or use the search box.';
  return 'Your location is not available right now. You can still search by city, cause or group.';
}

nearBtn.addEventListener('click', () => {
  if (!navigator.geolocation){
    showNearStatus('This browser cannot share your location. Use the search box to look up a city instead.', true);
    return;
  }
  nearBtn.disabled = true;
  showNearStatus('Finding your location…', false);
  navigator.geolocation.getCurrentPosition(pos => {
    nearBtn.disabled = false;
    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    placeUserMarker();
    applyFilter(currentFilter);          // repaints popups with distances and builds the list
    const top = nearestRecords(3);
    if (top.length) fitToVisibleNear(top);
  }, err => {
    nearBtn.disabled = false;
    showNearStatus(geoErrorMessage(err), true);
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 });
});

function fitToVisibleNear(top){
  const pts = [[userPos.lng, userPos.lat]].concat(top.map(x => [x.rec.lng, x.rec.lat]));
  const b = new maplibregl.LngLatBounds(pts[0], pts[0]);
  pts.forEach(pt => b.extend(pt));
  // On a phone the list covers the top of the map, so leave more room there.
  const narrow = window.innerWidth <= 640;
  map.fitBounds(b, { padding: { top: narrow ? 330 : 120, bottom: 60, left: narrow ? 40 : 380, right: narrow ? 40 : 90 }, maxZoom: 14, duration: 900 });
}

document.getElementById('finder').addEventListener('submit', e => {
  e.preventDefault();
  clearTimeout(searchTimer);
  setSearch(searchInput.value);
  if (searchTerms.length) fitToVisible();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => applyFilter(btn.dataset.filter));
});

function renderLegend(){
  const legend = document.getElementById('legend');
  let html = '<div class="legend-title">Organizations</div>';
  orgData.forEach(orgGroup => {
    html += `<div class="row"><span class="dot" style="background:${orgGroup.color}"></span><span>${orgGroup.org}</span></div>`;
  });
  legend.innerHTML = html;
}

// The map's vector tiles/style and the events.json fetch load
// independently and can finish in either order, so track both readiness
// signals and only draw pins once BOTH are done -- attaching a single
// map.on('load', ...) after awaiting the fetch would silently miss the
// map's load event if it happened to fire first.
let mapReady = false;
map.on('load', () => { mapReady = true; tryRenderPins(); });

function tryRenderPins(){
  if (mapReady && orgData.length) {
    renderPins();
    renderLegend();
  }
}

async function init(){
  await loadOrgData();
  tryRenderPins();
  loadBookingCount();
}

init();
</script>

<script src="site.js"></script>
</body>
